grasp_task:
  ros__parameters:
    # 权威配置来源：保持不变，继续由 tools/grasp/config.yaml 维护
    tools_config_path: "/home/ysc/2026YuYaoGuoSai/tools/grasp/config.yaml"

    # topic 名，保持与现有模块一致
    start_topic: "/grasp/start"
    place_topic: "/grasp/place"
    set_zone_topic: "/grasp/set_zone"
    state_topic: "/grasp/state"
    result_topic: "/grasp/result"
    move_topic: "/move"
    command_topic: "/pose_control/command"
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/leg_odom2"

    # 运行时行为
    cv_show: true                           # 是否 cv2.imshow 调试图像（无 X display 时必须 false，否则 Qt xcb 崩）
    motion_stop_timeout_s: 15.0             # 等 pose_control 执行到位的最大时间
    motion_stop_zero_duration_s: 0.5          # /cmd_vel 持续接近零多少秒算到位
    odom_fresh_timeout_s: 0.5               # 里程计超时判定（暂未使用）

    # ─── ROI 检测区域限制（避免左右两侧干扰色块）─────────────────────────
    # 启用后，只在画面中心区域检测色块，假设 block_align 已对齐目标在中心
    use_roi: true                           # 是否启用 ROI 限制
    roi_center_ratio: 0.6                   # ROI 宽度和高度占画面的比例（0.6 = 中心 60%）

    # ─── 多轮循环支持（默认 1 保持向后兼容，abcd_task launch 里覆写为 4）──
    max_rounds: 1
    inter_round_wait_s: 0.5

    # ─── 横向对齐开关（已废弃，合并 block_align 后不再使用）────────────
    # 保留参数以兼容旧代码，实际对齐逻辑在 block_align 阶段执行
    enable_lateral_align: false

    # ─── 2026-08-15: block_align 合并参数 ────────────────────────────
    enable_block_align: true                # 是否启用 block_align 阶段（合并后的视觉对齐）
    block_align_target_distance_m: 0.25     # block_align 目标停止距离
    block_align_lateral_threshold_mm: 15.0  # 横向对齐阈值（X_cam 偏差死区）
    block_align_distance_threshold_m: 0.02  # 前进距离阈值
    block_align_max_rounds: 5               # 对齐最大轮次
    block_align_detect_timeout_s: 15.0      # 检测超时
    block_align_lateral_polarity: -1        # 横向极性（-1: 偏右时向右移）
    block_align_motion_watchdog_s: 3.0      # 运动链路看门狗超时
    target_color: ""                        # 目标颜色过滤 "red"/"green"/"" (空=检测所有颜色)
