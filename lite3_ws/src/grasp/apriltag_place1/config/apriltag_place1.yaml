# NOTE(2026-08-11): 顶层 key 必须匹配节点名（super().__init__("apriltag_place1_node")）。
# 之前拼写成 `apriltag_place1:` 导致本文件里的所有参数（含标定后的相机内参）
# 全都被 rclpy 忽略，代码 default 覆盖 yaml——已修复。
apriltag_place1_node:
  ros__parameters:
    # ── 外部触发接口 ──────────────────────────────────────────────────────────
    trigger_topic: "/apriltag_place1/start"

    # ── 摄像头（头部 Intel RealSense D435i RGB 流）────────────────────────────
    # 注意：/dev/video6 是 RealSense（真机实测），/dev/video0 是机械臂 USB 摄像头
    # 以 v4l2-ctl --list-devices 现场确认
    camera_device: "/dev/video6"
    image_width: 640
    image_height: 480
    fps: 30

    # ── 内参（2026-08-02 实测标定，landscape 横贴：0.5/0.7/0.8m 三点 fy 平均 826.9；
    #    0.6m 测量值 885.7 偏差 >5% 已剔除。注意该值为 landscape 约定的等效 fy，
    #    与节点内 tz = fy*0.210/h_px 配套使用，勿与其他方向的标定值混用）──
    camera_matrix: [826.9, 0.0, 320.0, 0.0, 826.9, 240.0, 0.0, 0.0, 1.0]
    dist_coeffs: [-0.1571, -0.218, -0.0024, -0.0011, 0.2089]

    # ── Tag 参数 [TODO: tag_size_m 须用尺子量黑色编码区域边长，不含白边] ────
    tag_family: "tag25h9"
    target_tag_id: 0
    tag_size_m: 0.083

    # ── 站位（2026-08-11 重构：不再有 blind_forward，approach 一步走到目标距离）─
    closed_loop_end_dist: 1.0        # 视觉闭环 approach 终点，与 tag 的目标 tz（米）
    # final_forward_offset_m 已废弃（不再盲进），保留为 0.0 兼容旧代码引用
    final_forward_offset_m: 0.0

    # ── 对准阈值 ──────────────────────────────────────────────────────────────
    yaw_align_threshold_deg: 3.0
    max_yaw_step_deg: 3.0            # yaw_finetune 单步旋转限幅，防惯性过冲
    lateral_threshold_m: 0.03
    distance_threshold_m: 0.12       # 放宽到 12cm 应对测距噪声+pose_controller超调

    # ── 流程控制 ──────────────────────────────────────────────────────────────
    stable_frames: 10              # wait_detect 瞄准滤波帧数（从15降到10，配合quad_decimate=2.0加速）
    max_rounds: 10                 # lateral / approach 各阶段最大修正轮次
    max_yaw_finetune_rounds: 5     # yaw 收尾修正最大次数（从 3 增到 5）；达到后即使仍有残余偏差也 emit 完成
    lost_tolerance_s: 2.0          # Tag 短暂丢失时沿用上次位姿的时长
    detect_timeout_s: 15.0         # 从10.0增加到15.0，给足检测时间
    cmd_vel_zero_timeout_s: 1.5      # /cmd_vel 持续为零才认为运动完成，机械狗惯性大需加长
    move_timeout_s: 10.0

    # ── pose_controller 健康检查（2026-08-14 新增）─────────────────────────────
    # 运动链路看门狗：如果 /cmd_vel 或 /leg_odom2 超过此时长未收到，
    # 且当前正在等待运动完成，则认为 pose_controller 异常，发送 cancel 重置
    motion_watchdog_timeout_s: 5.0     # 从 3.0 增加到 5.0，避免旋转运动误判
    # 重置后的恢复等待时间（秒）
    motion_reset_recovery_s: 1.0

    # ── 横向搜索（wait_detect 超时兜底）─────────────────────────────────────
    search_step_m: 0.10            # 每步横移距离（米），参考 block_align
    search_max_steps: 8            # 最多搜索步数
    search_timeout_s: 60.0         # 全局搜索超时（秒）
