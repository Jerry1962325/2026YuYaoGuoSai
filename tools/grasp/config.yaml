#  grasp 模块配置文件
#  带 [TODO: 现场标定] 的参数需要上机后实测修改
#  修改本文件后重启 main.py 即生效，无需改代码

runtime:
  mode: "pc"                            # "pc" | "robot"；命令行 --mode 优先级更高

hardware:
  arm_serial_port: "/dev/ttyUSB0"     # [TODO: 现场标定] Lite3 感知主机上确认: ls /dev/ttyUSB*
  arm_serial_baud: 500000             # 舵机波特率，一般不变
  arm_cam_device: "/dev/video4"       #  机械臂摄像头

arm:
  moving_speed: 500                  # 舵机运动速度 (0~4095)
  moving_acc: 30                      # 舵机加速度
  gripper_open_val: 1847              # 夹爪张开值（最大张开约 1600）
  gripper_close_val: 2250             # 夹爪闭合目标值（空载时会夹到此位置）
  gripper_pos_gap_threshold: 30      # [TODO: 现场标定] 夹爪位置差判断阈值：空载差<此值，夹住物体差>此值
  grasp_retry_max: 3                  # 抓取失败最大重试次数
  wait_position_timeout: 5.0          # 等待舵机到位超时（秒）
  wait_position_threshold: 30         # 到位判定容差（舵机脉冲值，约 ±3°）

detection:
  # 机械臂摄像头内参 [TODO: 现场标定] 用 tools_box/camera_params/camera_params.py 重新标定
  arm_cam_fx: 388.1454
  arm_cam_fy: 387.7497
  arm_cam_cx: 329.4121
  arm_cam_cy: 223.481
  arm_cam_dist: [-0.1571, -0.218, -0.0024, -0.0011, 0.2089]

  # 红色长条 HSV 范围 [TODO: 现场标定] 用 tools_box/hsv_picker/hsv_picker.py 提取
  # 红色跨 0°/180° 分两段，两段掩码取并集
  hsv_red_lower1: [0,   80, 120]
  hsv_red_upper1: [10,  255, 255]
  hsv_red_lower2: [160, 80, 100]
  hsv_red_upper2: [180, 255, 255]

  # 绿色长条 HSV 范围 [TODO: 现场标定]
  hsv_green_lower: [40, 80, 80]
  hsv_green_upper: [80, 255, 255]

  block_min_area: 800                 # 色块最小面积（像素²），低于此值视为噪点
  block_real_width_mm: 40.0           # 长条实际宽度 40mm（题目给定，不变）

grasp:
  h_object: 25.0                       # [TODO: 现场标定] 末端抓取高度（mm，基座坐标系）
  distance_offset_mm: 190.0            # [TODO: 现场标定] 视觉测距固定补偿（mm），加到 Y_cam 上
  approach_clearance_mm: 25.0          # 步骤1与物块的水平安全余量（mm）
  approach_step_mm: 1.0                # 等高前进每步步长（mm），越小越平滑
  align_offset_threshold_mm: 10.0      # X_cam 偏移超过此值才触发横向对齐（mm）
  lost_frames_max: 10
  distance_avg_window: 20
  detect_timeout: 30.0
  grasp_retry_max: 3

placement:
  # 各放置区对应机械臂末端参数 [TODO: 现场标定]
  # dis: 水平距离(mm)，height: 末端高度(mm)
  zones:
    A: {dis: 220, height: 30}
    B: {dis: 220, height: 30}
    C: {dis: 220, height: 30}
    D: {dis: 220, height: 30}
  lower_timeout: 3.0                  # 放置下降等待（秒）

inspection:
  default_zone: "A"                   # 占位默认区，真实值由 InspectionMemory.set_zone() 注入
